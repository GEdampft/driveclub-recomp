; DriveClub Recomp v0.2.5-vr1.2 custom HUD + manual camera offsets.
; Save next to DriveClub.exe; restart the game to apply changes.
; Do not overwrite data/user/savedata: keep your existing save directory.
; All distances in metres. PitchOffset in degrees.
[HUD]
Width=1.61
Height=0.06
Distance=1.10

; Short Xbox L3 press (release): toggle offset. Long L3 hold: recenter view, same as F8.
; Keyboard F10 toggles offset; keyboard F8 recentres as before.
; Default L3 may be remapped to pad_up, pad_down, pad_left, pad_right or off.
; Press again before selecting a cockpit, bonnet or bumper view.
; This is the manual-offset build, ported to 0.2.5-vr1.2, with no mode detection.
[ThirdPersonFar]
Enabled=1
ToggleButton=l3
; Quick press toggles offset on release; holding 800 ms recentres (F8).
; May be adjusted between 350 and 2500 milliseconds.
LongPressMs=800
DistanceOffset=1.50
HeightOffset=0.50
PitchOffset=0.0
