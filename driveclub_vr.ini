; DriveClub Recomp v0.2.4-vr1.1 custom HUD + manual camera offsets.
; Save next to DriveClub.exe; restart the game to apply changes.
; All distances in metres. PitchOffset in degrees.
[HUD]
Width=1.73
Height=0.095
Distance=1.10

; Five camera views: bumper, bonnet, cockpit, chase near, chase far.
; In a race, press F6 once while viewing each third-person camera to MARK it.
; The offset will then apply only to the marked views when cycling cameras
; with Xbox Y / keyboard C. Press F6 again in the same view to unmark it.
; F5 CLEARS all markings (then mark the third-person views again).
; Camera positions are learned by counting camera-cycle button presses.
; A fresh race can reset the game's active view: press F5 and remark if
; offsets appear in the wrong view. This is an experimental mapping method.
; Restart game after changing values in this file.
[ThirdPersonFar]
Enabled=1
DistanceOffset=1.50
HeightOffset=0.50
PitchOffset=0.0
